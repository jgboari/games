<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#46301F">
<title>Conquistas de Cascadia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,700;0,800;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bark:#46301F; --bark-2:#5C4029; --bark-3:#6E5138;
  --parchment:#F2ECDC; --parchment-2:#E8DFC9;
  --pine:#1E6046; --pine-dk:#154434;
  --ink:#2B1D12; --ink-soft:#6B5744;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bark);color:var(--ink);font-family:Karla,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{
  max-width:480px;margin:0 auto;min-height:100vh;background:var(--parchment);
  background-image:
    radial-gradient(circle at 18% 12%, rgba(124,162,78,.10), transparent 45%),
    radial-gradient(circle at 88% 68%, rgba(224,166,43,.12), transparent 42%);
  box-shadow:0 0 0 1px rgba(0,0,0,.25);
  padding-bottom:calc(96px + env(safe-area-inset-bottom));overflow-x:hidden;
}
.sign{
  background:linear-gradient(178deg,var(--bark-3),var(--bark-2) 40%,var(--bark));color:#F6EFDF;
  border-radius:8px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -3px 0 rgba(0,0,0,.28), 0 2px 5px rgba(0,0,0,.22);
}
.sign::after{content:"";position:absolute;inset:4px;border-radius:5px;border:1px solid rgba(246,239,223,.16);pointer-events:none}

header{padding:18px 16px 14px;background:linear-gradient(180deg,#2E5E3E 0%,#35704A 46%,#6E9A4C 74%,#C9A94B 100%);border-bottom:3px solid var(--bark);position:relative;overflow:hidden}
header .ridge{position:absolute;left:0;right:0;bottom:0;height:34px;opacity:.55}
h1{font-family:Bitter,Georgia,serif;font-weight:800;font-size:23px;line-height:1.08;margin:0;padding:11px 14px 13px;text-align:center;position:relative;z-index:2}
h1 small{display:block;font-size:11.5px;font-weight:500;letter-spacing:.22em;color:#D9C9A6;margin-top:5px;font-family:Karla,sans-serif}

.players{padding:14px 12px 4px}
.pcard{background:rgba(255,255,255,.5);border:1px solid rgba(70,48,31,.18);border-left:5px solid var(--tok,#9A7549);border-radius:10px;padding:9px 11px 7px;margin-bottom:9px}
.prow{display:flex;align-items:center;gap:9px}
.tokbtn{flex:0 0 auto;width:36px;height:36px;border-radius:9px;border:1px solid rgba(70,48,31,.28);background:var(--parchment-2);display:grid;place-items:center;cursor:pointer;padding:0}
.tokbtn:active{transform:scale(.94)}
.pname{flex:1 1 auto;min-width:0;border:0;background:transparent;font-family:Bitter,Georgia,serif;font-weight:700;font-size:17px;color:var(--ink);padding:3px 2px;border-bottom:1px dashed rgba(70,48,31,.3)}
.pname:focus{outline:none;border-bottom-color:var(--pine)}
.pscore{flex:0 0 auto;text-align:right;line-height:1.05}
.pscore b{font-family:Bitter,Georgia,serif;font-size:20px;color:var(--pine-dk)}
.pscore span{font-size:10.5px;color:var(--ink-soft);display:block}
.prank{margin-top:6px;font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.prank b{font-family:Bitter,serif;color:var(--bark);font-weight:700;font-size:12.5px}
.pstats{margin-top:3px;font-size:11.5px;color:var(--ink-soft)}
.pstats b{font-family:Bitter,serif;font-weight:700;color:var(--pine-dk);font-size:12.5px}
.trail{display:block;width:100%;height:auto;margin-top:5px}

nav{display:flex;gap:4px;padding:6px 12px 9px;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--parchment) 72%,rgba(242,236,220,0))}
.tab{flex:1;border:0;cursor:pointer;padding:9px 3px 10px;border-radius:8px 8px 3px 3px;font-family:Bitter,Georgia,serif;font-weight:700;font-size:12px;background:var(--parchment-2);color:var(--bark-2);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.tab small{display:block;font-family:Karla,sans-serif;font-weight:500;font-size:9.5px;opacity:.7;margin-top:2px}
.tab[aria-selected="true"]{background:linear-gradient(178deg,var(--bark-3),var(--bark-2));color:#F6EFDF;box-shadow:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -3px 0 rgba(0,0,0,.3)}
.tab[aria-selected="true"] small{color:#D9C9A6;opacity:1}

main{padding:2px 12px 0}
.howto{font-size:12.5px;color:#EFE6D2;background:var(--pine-dk);border-radius:9px;padding:9px 12px;margin:2px 0 11px;line-height:1.4}
.howto b{color:#F6D98A}
.toolbar{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font-size:12.5px;color:var(--ink-soft)}
.toolbar label{display:flex;align-items:center;gap:6px;cursor:pointer}
.toolbar input{accent-color:var(--pine);width:16px;height:16px}
.count{margin-left:auto;font-family:Bitter,serif;font-size:12px;color:var(--bark-2)}
.toolbar.hide{display:none}

.item{background:#FBF7EC;border:1px solid rgba(70,48,31,.16);border-radius:11px;margin-bottom:9px;overflow:hidden;box-shadow:0 1px 0 rgba(70,48,31,.07)}
.item.done{background:#F1F3E4;border-color:rgba(30,96,70,.3)}
.ihead{display:flex;align-items:center;gap:8px;padding:8px 10px 6px}
.num{flex:0 0 auto;font-family:Bitter,Georgia,serif;font-weight:800;font-size:15px;color:#F6EFDF;background:var(--bark-2);width:30px;height:26px;display:grid;place-items:center;border-radius:5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.goal{flex:0 0 auto;background:var(--pine);color:#fff;border-radius:999px;font-family:Bitter,serif;font-weight:700;font-size:13px;padding:3px 11px;border:2px dotted rgba(255,255,255,.55)}
.itext{padding:2px 11px 9px;font-size:14px;color:var(--ink);margin:0}
.cards{display:flex;gap:4px;padding:2px 10px 8px;flex-wrap:wrap}
.sc{display:flex;align-items:center;gap:4px;background:var(--bark-2);border-radius:5px;padding:2px 6px 2px 3px}
.sc i{width:15px;height:15px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.2)}
.sc b{font-family:Bitter,serif;font-size:12px;color:#F6EFDF;font-weight:700}
.objs{list-style:none;margin:0;padding:0 11px 8px}
.objs li{position:relative;padding:3px 0 3px 20px;font-size:13.5px;line-height:1.35;color:#3E2C1C}
.objs li::before{content:"";position:absolute;left:0;top:8px;width:11px;height:12px;background:var(--pine);opacity:.85;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}

.marks{display:flex;gap:7px;padding:0 10px 8px}
.mark{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid rgba(70,48,31,.28);background:transparent;color:var(--ink-soft);border-radius:8px;padding:8px 6px;cursor:pointer;font-family:Karla,sans-serif;font-weight:700;font-size:13px;min-height:42px;overflow:hidden}
.mark span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mark svg{flex:0 0 auto;opacity:.4}
.mark[aria-pressed="true"]{background:var(--tok);border-color:rgba(70,48,31,.55);color:#2B1D12;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.mark[aria-pressed="true"] svg{opacity:1}
.mark:active{transform:scale(.985)}
.mark:focus-visible,.tab:focus-visible,.tokbtn:focus-visible,button:focus-visible,input:focus-visible{outline:2.5px solid var(--pine);outline-offset:2px}

.details{margin:0 10px 10px;background:rgba(70,48,31,.055);border:1px solid rgba(70,48,31,.14);border-radius:8px;padding:3px 0}
.dlabel{font-size:10.5px;letter-spacing:.02em;color:var(--ink-soft);padding:4px 9px 2px}
.drow{display:flex;align-items:center;gap:7px;padding:4px 9px 5px}
.drow>svg{flex:0 0 auto}
.drow input{border:0;background:transparent;font-family:Karla,sans-serif;font-weight:700;color:var(--bark-2);padding:3px 0;min-width:0}
.drow input[type=date]{flex:1 1 auto;font-size:12.5px;width:100%}
.drow input[data-empty="1"]{color:#A08B72;font-weight:500}
.pts{flex:0 0 auto;display:flex;align-items:baseline;gap:3px;background:#FBF7EC;border:1px solid rgba(70,48,31,.2);border-radius:6px;padding:2px 7px}
.pts input{width:38px;text-align:right;font-family:Bitter,Georgia,serif;font-size:14px;-moz-appearance:textfield}
.pts input::-webkit-outer-spin-button,.pts input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pts span{font-size:10.5px;color:var(--ink-soft)}

/* histórico */
.day{margin-bottom:12px}
.daysign{display:flex;align-items:baseline;gap:8px;background:linear-gradient(178deg,var(--bark-3),var(--bark-2));color:#F6EFDF;border-radius:7px 7px 0 0;padding:7px 11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.daysign b{font-family:Bitter,Georgia,serif;font-size:14.5px;font-weight:700}
.daysign span{font-size:11px;color:#D9C9A6;margin-left:auto}
.daybody{background:#FBF7EC;border:1px solid rgba(70,48,31,.16);border-top:0;border-radius:0 0 9px 9px;padding:2px 0}
.game{padding:8px 11px 9px;border-top:1px dashed rgba(70,48,31,.16)}
.game:first-child{border-top:0}
.gtag{display:inline-block;font-size:10.5px;font-weight:700;background:var(--pine);color:#fff;border-radius:4px;padding:1px 6px;margin-bottom:2px}
.gtag.n{background:#8A5A2B} .gtag.r{background:#3E6E8C}
.gdesc{font-size:12px;color:var(--ink-soft);line-height:1.35;margin:2px 0 6px}
.gline{display:flex;align-items:center;gap:8px;padding:3px 0}
.gline>svg{flex:0 0 auto}
.gline .gn{font-size:13px;font-weight:700;color:var(--bark);flex:0 0 auto;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{flex:1 1 auto;height:7px;border-radius:4px;background:rgba(70,48,31,.11);overflow:hidden;min-width:20px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--tok)}
.gp{flex:0 0 auto;font-family:Bitter,Georgia,serif;font-weight:700;font-size:14px;color:var(--bark);min-width:34px;text-align:right}
.gp.none{color:#A08B72;font-weight:500;font-size:12px}
.win{flex:0 0 auto;width:15px;height:15px;display:grid;place-items:center}
.win svg{display:block}

.empty{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:26px 14px 34px;font-style:italic;line-height:1.5}

footer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bark);border-top:2px solid #2E1F14;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.fbar{max-width:480px;margin:0 auto;display:flex;gap:7px}
.fbtn{flex:1;border:1px solid rgba(246,239,223,.28);background:rgba(246,239,223,.07);color:#EFE6D2;border-radius:7px;padding:9px 4px;font-size:12px;font-weight:700;font-family:Karla,sans-serif;cursor:pointer}
.fbtn:active{background:rgba(246,239,223,.18)}
.fbtn.danger{color:#F0B9A6;border-color:rgba(240,185,166,.35)}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:40;background:var(--pine-dk);color:#F3EAD3;font-size:12.5px;padding:7px 15px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.saved.on{opacity:1}

.sheet{position:fixed;inset:0;z-index:50;background:rgba(30,20,12,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:480px;background:var(--parchment);border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-family:Bitter,serif;font-size:16px;margin:0 0 3px}
.sheet p{margin:0 0 13px;font-size:12.5px;color:var(--ink-soft)}
.toks{display:flex;gap:8px}
.toks button{flex:1;aspect-ratio:1;border-radius:11px;border:2px solid rgba(70,48,31,.22);background:#FBF7EC;display:grid;place-items:center;cursor:pointer}
.toks button[aria-pressed="true"]{border-color:var(--pine);box-shadow:0 0 0 3px rgba(30,96,70,.18)}
.toks button:disabled{opacity:.32;cursor:not-allowed}
.sheet .close{width:100%;margin-top:14px;border:0;background:var(--bark-2);color:#F6EFDF;border-radius:9px;padding:11px;font-family:Bitter,serif;font-weight:700;font-size:14px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <svg class="ridge" viewBox="0 0 480 34" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 34 L52 12 L86 22 L128 4 L172 24 L214 10 L262 26 L306 8 L352 22 L398 11 L440 24 L480 14 L480 34 Z" fill="#1F3E2C" opacity=".65"/>
    <path d="M0 34 L40 22 L92 30 L140 18 L190 30 L244 20 L300 31 L358 21 L410 30 L480 22 L480 34 Z" fill="#16301F" opacity=".7"/>
  </svg>
  <div class="sign"><h1>Conquistas de Cascadia<small>REGISTRO DE DOIS BIÓLOGOS</small></h1></div>
</header>

<section class="players" id="players"></section>

<nav role="tablist" aria-label="Modos de conquista">
  <button class="tab" role="tab" aria-selected="true"  data-mode="cen">Cenários<small>15 desafios</small></button>
  <button class="tab" role="tab" aria-selected="false" data-mode="nor">Partida normal<small>25 metas</small></button>
  <button class="tab" role="tab" aria-selected="false" data-mode="res">Restrições<small>10 regras</small></button>
  <button class="tab" role="tab" aria-selected="false" data-mode="hist">Histórico<small id="histCount">por data</small></button>
</nav>

<main>
  <div class="howto" id="howto"></div>
  <div class="toolbar" id="toolbar">
    <label><input type="checkbox" id="pending"> Só o que falta</label>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
</main>

<footer>
  <div class="fbar">
    <button class="fbtn" id="exp">Exportar</button>
    <button class="fbtn" id="imp">Importar</button>
    <button class="fbtn danger" id="rst">Zerar tudo</button>
  </div>
</footer>
<div class="saved" id="saved">Progresso salvo</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="box">
    <h2 id="sheetTitle">Escolha a trilha</h2>
    <p>Cada biólogo caminha por uma trilha de cor própria, igual à do livro de regras.</p>
    <div class="toks" id="toks"></div>
    <button class="close" id="sheetClose">Pronto</button>
  </div>
</div>

</div>

<script>
/* ===== Dados do livro de regras (Cascadia — Conquistas, p. 12–14) ===== */
const SPECIES=[
  {n:'Urso',c:'#6E4A2E'},{n:'Cervo',c:'#C9A85C'},{n:'Salmão',c:'#DE3C7C'},
  {n:'Búteo',c:'#5BAEDC'},{n:'Raposa',c:'#E88428'}
];
const TOKENS={
  circulo:{n:'Círculo',c:'#9A7549'}, oval:{n:'Oval',c:'#E0D2AC'},
  triangulo:{n:'Triângulo',c:'#EBA2BE'}, losango:{n:'Losango',c:'#A6D0E8'},
  quadrado:{n:'Quadrado',c:'#F2B183'}
};
const MILESTONES=[
  {at:8,n:'Estudo de Rio',c:'#4FA3C7'},{at:16,n:'Estudo de Zona Úmida',c:'#8DBE4A'},
  {at:24,n:'Estudo de Floresta',c:'#2F6B3F'},{at:32,n:'Estudo de Montanha',c:'#AFC4D2'},
  {at:40,n:'Estudo de Pradaria',c:'#E8B93C'},{at:50,n:'Biólogo de Cascadia',c:'#C98A2E'}
];
const CEN=[
  {p:80,c:'AAAAA',o:[]},{p:80,c:'BBBBB',o:[]},{p:80,c:'CCCCC',o:[]},{p:85,c:'DDDDD',o:[]},
  {p:85,c:'CDBBB',o:['Receba a pontuação máxima de Raposa 3 vezes']},
  {p:85,c:'DBCCB',o:['Jogue pelo menos 4 de cada Espécie']},
  {p:90,c:'BCCDC',o:['Pontue 20+ por Búteo']},
  {p:90,c:'CBBAD',o:['Pontue 5+ por Floresta','Urso não pode ficar adjacente a Cervo']},
  {p:90,c:'CADCB',o:['Pontue 10+ por cada Espécie','Pontue 5+ por cada Habitat']},
  {p:95,c:'CBDBB',o:['Pontue 60 no total pelas Espécies','Pontue 7+ por quaisquer 3 Habitats']},
  {p:95,c:'BAACA',o:['Pontue 30+ por Urso','Floresta e Rio não podem ficar adjacentes']},
  {p:95,c:'ABAAC',o:['Receba a pontuação máxima de Salmão 1 vez','Cervo não pode ser colocado em Floresta','Pontue 12+ em 1 Habitat qualquer']},
  {p:100,c:'DCCBC',o:['Receba a pontuação máxima de Cervo 1 vez','Jogue pelo menos 5 Búteos','Búteo deve ficar adjacente a Cervo']},
  {p:100,c:'ACBAD',o:['Montanha e Pradaria não podem ficar adjacentes','Zona Úmida e Rio não podem ficar adjacentes','Pontue 35 no total pelos Habitats']},
  {p:100,c:'ADADA',o:['Pontue 5+ por Floresta','Pontue 7+ por quaisquer 3 Habitats','Pontue 20+ por quaisquer 2 Espécies']}
];
const NOR=[
  'Pontue 80+','Pontue 85+','Pontue 90+','Pontue 95+','Pontue 100+','Pontue 105+','Pontue 110+',
  'Não tenha nenhuma Ficha de Natureza restante',
  'Não tenha nenhum Urso','Não tenha nenhum Cervo','Não tenha nenhum Salmão','Não tenha nenhum Búteo','Não tenha nenhuma Raposa',
  'Tenha mais do que 10 de uma única Espécie','Vença pela Maioria em 3 Habitats','Pontue 5+ em todos os Habitats',
  'Pontue 12+ em um Habitat','Pontue 15+ em um Habitat','Pontue 12+ em cada Espécie','Pontue 20+ em duas Espécies','Pontue 30+ em uma Espécie',
  'Termine a partida com 5+ Fichas de Natureza','Termine a partida com 10+ Fichas de Natureza',
  'Não tenha Habitats de Pedra Angular preenchidos','Tenha apenas 3 Espécies diferentes'
];
const RES=[
  'Pelo menos um Habitat deve combinar ao posicionar peças.',
  'Nenhum Habitat pode combinar ao posicionar peças. Ignore a pontuação dos Habitats nesta partida.',
  'Todos os corredores de Habitat de exatamente três peças valem 3 pontos cada.',
  'Corredores de Habitat precisam ter tamanho 5+ para pontuar.',
  'Jogue com apenas três pares de peça/marcador na exibição.',
  'Jogue com dois conjuntos de Cartas de Pontuação de Espécie — cada jogador escolhe individualmente qual dos dois pontuará.',
  'Não use as Peças de Habitat Iniciais. O meio ambiente de cada jogador começa com duas Peças de Habitat aleatórias.',
  'É necessário duas Fichas de Natureza para realizar uma Ação de Ficha de Natureza.',
  'Você não pode colocar o Marcador de Espécie na Peça de Habitat que você acabou de posicionar.',
  'Jogue revelando as cartas: cada jogador começa com uma das cinco Cartas de Pontuação de Espécie na mão (secreta) e as restantes ficam à vista na mesa. Ao usar uma ficha de natureza, revele sua carta.'
];
const HOWTO={
  cen:'Vale em partidas com dois jogadores ou solo. <b>Todos os que passarem no cenário</b> marcam a conquista. Solo: siga do 1 ao 15, a dificuldade sobe.',
  nor:'Partida normal pelas regras do jogo. Apenas o <b>vencedor</b> marca, e <b>no máximo uma</b> conquista por partida.',
  res:'Partida normal com uma restrição escolhida da lista. Apenas o <b>vencedor</b> marca a conquista da restrição usada.',
  hist:'Todas as partidas registradas, da mais recente para a mais antiga, com o placar dos dois. Para corrigir data ou pontos, volte ao modo correspondente.'
};
const TOTAL=CEN.length+NOR.length+RES.length; // 50
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const BARMAX=130; // referência da barra de placar

/* ===== Armazenamento: artefato → navegador → memória ===== */
const KEY='cascadia-conquistas-v3', OLD=['cascadia-conquistas-v2','cascadia-conquistas-v1'], mem={};
const Store={
  async get(k){
    k=k||KEY;
    if(window.storage&&window.storage.get){try{const r=await window.storage.get(k);if(r&&r.value)return r.value;}catch(e){}}
    try{const v=localStorage.getItem(k);if(v)return v;}catch(e){}
    return mem[k]||null;
  },
  async set(v){
    mem[KEY]=v;
    if(window.storage&&window.storage.set){try{await window.storage.set(KEY,v);return;}catch(e){}}
    try{localStorage.setItem(KEY,v);}catch(e){}
  }
};

/* ===== Estado =====
   log[i][id] = { m:true|false (conquista), d:'AAAA-MM-DD', s:número|null }
   Uma entrada existe quando aquele jogador disputou aquela partida. */
let players=[{name:'Jogador 1',token:'circulo'},{name:'Jogador 2',token:'losango'}];
let log=[{},{}];
let mode='cen';

const ent=(i,id)=>log[i][id]||null;
const has=(i,id)=>!!(log[i][id]&&log[i][id].m);
const played=id=>!!(log[0][id]||log[1][id]);
const total=i=>Object.values(log[i]).filter(e=>e.m).length;
const scores=i=>Object.values(log[i]).map(e=>e.s).filter(s=>typeof s==='number');

function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function fmt(iso){ if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return ''; const[y,m,d]=iso.split('-'); return `${+d} ${MES[+m-1]} ${y}`; }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function touch(i,id){ if(!log[i][id]) log[i][id]={m:false,d:today(),s:null}; return log[i][id]; }
// Uma entrada só some quando não sobrou nada que o usuário tenha digitado.
// hard=true (ao desmarcar a conquista) descarta também a data automática.
function prune(i,id,hard){
  const e=log[i][id]; if(!e||e.m) return;
  if(e.s===null && (hard || !e.d)) delete log[i][id];
}

function serialize(){return JSON.stringify({v:3,players:players.map((p,i)=>({name:p.name,token:p.token,log:log[i]}))});}
let t=null;
function save(){
  clearTimeout(t);
  t=setTimeout(async()=>{
    await Store.set(serialize());
    const s=document.getElementById('saved');
    s.classList.add('on'); setTimeout(()=>s.classList.remove('on'),1100);
  },250);
}
function load(raw){
  try{
    const d=JSON.parse(raw);
    if(!d||!Array.isArray(d.players))return false;
    d.players.slice(0,2).forEach((p,i)=>{
      if(p.name) players[i].name=String(p.name).slice(0,22);
      if(p.token&&TOKENS[p.token]) players[i].token=p.token;
      const L={};
      if(p.log&&typeof p.log==='object'){                                  // v3
        Object.entries(p.log).forEach(([k,v])=>{
          L[k]={m:!!v.m, d:v.d||'', s:(typeof v.s==='number'&&isFinite(v.s))?v.s:null};
        });
      } else if(Array.isArray(p.marks)){                                   // v1
        p.marks.forEach(id=>L[id]={m:true,d:'',s:null});
      } else if(p.marks&&typeof p.marks==='object'){                       // v2
        Object.entries(p.marks).forEach(([k,v])=>L[k]={m:true,d:v||'',s:null});
      }
      log[i]=L;
    });
    return true;
  }catch(e){return false;}
}

/* ===== Fichas de natureza ===== */
function shape(kind,s,fill,stroke){
  const h=s/2, st=stroke?` stroke="${stroke}" stroke-width="1.2"`:'';
  if(kind==='circulo')   return `<circle cx="${h}" cy="${h}" r="${h*.78}" fill="${fill}"${st}/>`;
  if(kind==='oval')      return `<ellipse cx="${h}" cy="${h}" rx="${h*.58}" ry="${h*.82}" fill="${fill}"${st}/>`;
  if(kind==='triangulo') return `<path d="M${h} ${s*.14} L${s*.90} ${s*.82} L${s*.10} ${s*.82} Z" fill="${fill}"${st}/>`;
  if(kind==='losango')   return `<path d="M${h} ${s*.08} L${s*.88} ${h} L${h} ${s*.92} L${s*.12} ${h} Z" fill="${fill}"${st}/>`;
  return `<rect x="${s*.15}" y="${s*.15}" width="${s*.70}" height="${s*.70}" rx="${s*.09}" fill="${fill}"${st}/>`;
}
const tok=(k,s,f)=>`<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true">${shape(k,s,f,'rgba(43,29,18,.45)')}</svg>`;
const hexOk=`<svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><path d="M7.5 .8 L14 4.4 L14 10.6 L7.5 14.2 L1 10.6 L1 4.4 Z" fill="#1E6046"/><path d="M4.3 7.6 L6.6 9.9 L10.8 5.2" fill="none" stroke="#F6EFDF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ===== Trilha (p. 12) ===== */
function trail(i){
  const p=players[i], col=TOKENS[p.token].c, done=total(i);
  const W=500,H=54,x0=16,x1=486, step=(x1-x0)/(TOTAL-1), midY=30, amp=7;
  let bands='',prev=0;
  MILESTONES.forEach(m=>{
    const a=x0+prev*step-step/2, b=x0+(m.at-1)*step+step/2;
    bands+=`<rect x="${a.toFixed(1)}" y="14" width="${(b-a).toFixed(1)}" height="30" fill="${m.c}" opacity=".22"/>`;
    prev=m.at;
  });
  const pts=[]; for(let n=1;n<=TOTAL;n++) pts.push([n,x0+(n-1)*step,midY+Math.sin(n*.42)*amp]);
  const path='M'+pts.map(q=>`${q[1].toFixed(1)} ${q[2].toFixed(1)}`).join(' L');
  let nodes='';
  pts.forEach(([n,x,y])=>{
    const ms=MILESTONES.find(m=>m.at===n), on=n<=done;
    if(ms) nodes+=`<g transform="translate(${(x-9).toFixed(1)},${(y-8).toFixed(1)})"><rect width="18" height="16" rx="3" fill="${on?'#1E6046':'#46301F'}" opacity="${on?1:.55}"/><text x="9" y="11.6" text-anchor="middle" font-family="Bitter,Georgia,serif" font-size="9.5" font-weight="700" fill="#F6EFDF">${n}</text></g>`;
    else nodes+=`<g transform="translate(${(x-4.5).toFixed(1)},${(y-4.5).toFixed(1)})">${shape(p.token,9,on?col:'#FBF7EC',on?'rgba(43,29,18,.55)':'rgba(70,48,31,.35)')}</g>`;
  });
  return `<svg class="trail" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trilha: ${done} de ${TOTAL} conquistas">${bands}<path d="${path}" fill="none" stroke="rgba(70,48,31,.28)" stroke-width="1" stroke-dasharray="2 3"/>${nodes}</svg>`;
}
function rank(done){
  let cur=done===0?'Ainda na trilha':'Trilha iniciada', next=MILESTONES[0];
  MILESTONES.forEach((m,k)=>{ if(done>=m.at){cur=m.n; next=MILESTONES[k+1]||null;} });
  return {cur,next};
}

/* ===== Render ===== */
function renderPlayers(){
  document.getElementById('players').innerHTML=players.map((p,i)=>{
    const col=TOKENS[p.token].c, done=total(i), {cur,next}=rank(done), sc=scores(i);
    const stats = sc.length
      ? `<div class="pstats">${sc.length} partida${sc.length===1?'':'s'} com placar · melhor <b>${Math.max(...sc)}</b> · média <b>${Math.round(sc.reduce((a,b)=>a+b,0)/sc.length)}</b></div>`
      : `<div class="pstats">Anote os pontos de cada partida para ver melhor e média aqui.</div>`;
    return `<div class="pcard" style="--tok:${col}">
      <div class="prow">
        <button class="tokbtn" data-tok="${i}" aria-label="Trocar a trilha de ${esc(p.name)}">${tok(p.token,22,col)}</button>
        <input class="pname" data-name="${i}" value="${esc(p.name)}" maxlength="22" aria-label="Nome do jogador ${i+1}" spellcheck="false">
        <div class="pscore"><b>${done}</b><span>de ${TOTAL}</span></div>
      </div>
      <div class="prank"><b>${cur}</b><span>${next?`faltam ${next.at-done} para ${next.n}`:'trilha completa'}</span></div>
      ${stats}
      ${trail(i)}
    </div>`;
  }).join('');
}

function entries(m){
  if(m==='cen') return CEN.map((s,i)=>({id:'cen-'+(i+1),n:i+1,sc:s}));
  if(m==='nor') return NOR.map((x,i)=>({id:'nor-'+(i+1),n:i+1,txt:x}));
  return RES.map((x,i)=>({id:'res-'+(i+1),n:i+1,txt:x}));
}
function labelOf(id){
  const [m,n]=id.split('-'), k=+n-1;
  if(m==='cen') return {tag:'Cenário '+n, cls:'', txt:`Meta de ${CEN[k].p}+ pontos${CEN[k].o.length?' · '+CEN[k].o.join(' · '):''}`};
  if(m==='nor') return {tag:'Partida normal', cls:'n', txt:'Conquista '+n+': '+NOR[k]};
  return {tag:'Restrição '+n, cls:'r', txt:RES[k]};
}
function cardsHtml(l){
  return `<div class="cards">${SPECIES.map((s,i)=>`<span class="sc" title="${s.n}: carta ${l[i]}"><i style="background:${s.c}"></i><b>${l[i]}</b></span>`).join('')}</div>`;
}
function marksHtml(id){
  const btns=players.map((p,i)=>{
    const col=TOKENS[p.token].c, on=has(i,id);
    return `<button class="mark" style="--tok:${col}" data-mark="${id}" data-p="${i}" aria-pressed="${on}">${tok(p.token,17,col)}<span>${esc(p.name)}</span></button>`;
  }).join('');
  if(!played(id)) return `<div class="marks">${btns}</div>`;
  const rows=players.map((p,i)=>{
    const col=TOKENS[p.token].c, e=ent(i,id), d=e?e.d:'', s=(e&&e.s!==null)?e.s:'';
    return `<div class="drow">${tok(p.token,13,col)}
      <input type="date" value="${d}" data-f="d" data-id="${id}" data-p="${i}" data-empty="${d?0:1}" aria-label="Data da partida de ${esc(p.name)}">
      <label class="pts"><input type="number" inputmode="numeric" min="0" max="400" step="1" value="${s}" placeholder="—" data-f="s" data-id="${id}" data-p="${i}" aria-label="Pontos de ${esc(p.name)}"><span>pts</span></label>
    </div>`;
  }).join('');
  return `<div class="marks">${btns}</div>
    <div class="details"><div class="dlabel">Data e placar desta partida</div>${rows}</div>`;
}

function renderHistory(){
  const days={};
  Object.keys({...log[0],...log[1]}).forEach(id=>{
    const d=(ent(0,id)&&ent(0,id).d)||(ent(1,id)&&ent(1,id).d)||'—';
    (days[d]=days[d]||[]).push(id);
  });
  const keys=Object.keys(days).sort((a,b)=>a==='—'?1:b==='—'?-1:b.localeCompare(a));
  const nd=keys.filter(k=>k!=='—').length;
  document.getElementById('histCount').textContent = nd?`${nd} dia${nd===1?'':'s'}`:'por data';
  if(!keys.length) return `<p class="empty">Nenhuma partida registrada ainda.<br>Marque uma conquista em qualquer modo e ela aparece aqui, com data e placar.</p>`;

  return keys.map(k=>{
    const ids=days[k].sort();
    return `<div class="day">
      <div class="daysign"><b>${k==='—'?'Sem data':fmt(k)}</b><span>${ids.length} partida${ids.length===1?'':'s'}</span></div>
      <div class="daybody">${ids.map(id=>{
        const L=labelOf(id);
        const lines=players.map((p,i)=>{
          const e=ent(i,id); if(!e) return '';
          const col=TOKENS[p.token].c;
          const pct=e.s!==null?Math.max(4,Math.min(100,Math.round(e.s/BARMAX*100))):0;
          return `<div class="gline" style="--tok:${col}">${tok(p.token,15,col)}
            <span class="gn">${esc(p.name)}</span>
            <span class="bar">${e.s!==null?`<i style="width:${pct}%"></i>`:''}</span>
            <span class="gp${e.s===null?' none':''}">${e.s!==null?e.s:'—'}</span>
            <span class="win">${e.m?hexOk:''}</span></div>`;
        }).join('');
        return `<div class="game"><span class="gtag ${L.cls}">${L.tag}</span>
          <div class="gdesc">${esc(L.txt)}</div>${lines}</div>`;
      }).join('')}</div></div>`;
  }).join('');
}

function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===mode)));
  document.getElementById('howto').innerHTML=HOWTO[mode];
  const bar=document.getElementById('toolbar'), box=document.getElementById('list');

  if(mode==='hist'){ bar.classList.add('hide'); box.innerHTML=renderHistory(); return; }
  bar.classList.remove('hide');

  const all=entries(mode), pend=document.getElementById('pending').checked;
  const list=all.filter(e=>!pend||!(has(0,e.id)&&has(1,e.id)));
  document.getElementById('count').textContent=
    `${all.filter(e=>has(0,e.id)).length} · ${all.filter(e=>has(1,e.id)).length} de ${all.length}`;

  if(!list.length){ box.innerHTML=`<p class="empty">Tudo conquistado neste modo pelos dois. Desmarque “Só o que falta” para rever a lista.</p>`; renderHistory(); return; }
  box.innerHTML=list.map(e=>{
    const both=has(0,e.id)&&has(1,e.id);
    if(e.sc){
      const objs=e.sc.o.length?`<ul class="objs">${e.sc.o.map(o=>`<li>${o}</li>`).join('')}</ul>`:'';
      return `<article class="item${both?' done':''}">
        <div class="ihead"><span class="num">${e.n}</span><span class="goal">${e.sc.p}+ pontos</span></div>
        ${cardsHtml(e.sc.c)}${objs}${marksHtml(e.id)}</article>`;
    }
    return `<article class="item${both?' done':''}">
      <div class="ihead"><span class="num">${e.n}</span></div>
      <p class="itext">${e.txt}</p>${marksHtml(e.id)}</article>`;
  }).join('');
  renderHistory(); // mantém o contador da aba em dia
}

/* ===== Eventos ===== */
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode; render();
  window.scrollTo({top:document.querySelector('nav').offsetTop-2,behavior:'smooth'});
}));
document.getElementById('pending').addEventListener('change',render);

document.getElementById('list').addEventListener('click',ev=>{
  const b=ev.target.closest('.mark'); if(!b)return;
  const id=b.dataset.mark, i=+b.dataset.p;
  if(has(i,id)){ log[i][id].m=false; prune(i,id,true); }
  else { touch(i,id).m=true; if(!log[i][id].d) log[i][id].d=today(); }
  save(); renderPlayers(); render();
});
document.getElementById('list').addEventListener('change',ev=>{
  const f=ev.target.closest('[data-f]'); if(!f)return;
  const i=+f.dataset.p, id=f.dataset.id;
  if(f.dataset.f==='d'){
    const e=touch(i,id); e.d=f.value||''; f.dataset.empty=f.value?0:1; prune(i,id);
  } else {
    const v=f.value.trim();
    const n=v===''?null:Math.max(0,Math.min(400,Math.round(Number(v))));
    if(v!==''&&!isFinite(n)) return;
    const e=touch(i,id); e.s=n;
    if(n!==null&&!e.d) e.d=today();
    prune(i,id);
  }
  save(); renderPlayers();
  renderHistory(); // só atualiza o contador da aba; a lista fica intacta
});

document.getElementById('players').addEventListener('input',ev=>{
  const f=ev.target.closest('[data-name]'); if(!f)return;
  const i=+f.dataset.name;
  players[i].name=f.value||`Jogador ${i+1}`;
  save();
  document.querySelectorAll(`.mark[data-p="${i}"] span`).forEach(s=>s.textContent=players[i].name);
});

let sheetFor=0;
const sheet=document.getElementById('sheet');
document.getElementById('players').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-tok]'); if(!b)return;
  sheetFor=+b.dataset.tok;
  document.getElementById('sheetTitle').textContent=`Trilha de ${players[sheetFor].name}`;
  document.getElementById('toks').innerHTML=Object.entries(TOKENS).map(([k,v])=>{
    const taken=players[1-sheetFor].token===k;
    return `<button data-pick="${k}" aria-pressed="${players[sheetFor].token===k}" ${taken?'disabled':''} aria-label="${v.n}">${tok(k,26,v.c)}</button>`;
  }).join('');
  sheet.classList.add('on');
});
document.getElementById('toks').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-pick]'); if(!b||b.disabled)return;
  players[sheetFor].token=b.dataset.pick;
  save(); renderPlayers(); render(); sheet.classList.remove('on');
});
document.getElementById('sheetClose').addEventListener('click',()=>sheet.classList.remove('on'));
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.classList.remove('on');});

document.getElementById('exp').addEventListener('click',()=>{
  const data=serialize();
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download='conquistas-cascadia.json'; a.click(); URL.revokeObjectURL(a.href);
  }catch(e){ prompt('Copie este código para guardar seu progresso:',data); }
});
document.getElementById('imp').addEventListener('click',()=>{
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ if(load(r.result)){save();renderPlayers();render();}
      else alert('Arquivo não reconhecido. Use um arquivo exportado por este app.'); };
    r.readAsText(f);
  };
  inp.click();
});
document.getElementById('rst').addEventListener('click',()=>{
  if(!confirm('Apagar todas as partidas, datas e placares dos dois jogadores? Isso não pode ser desfeito.'))return;
  log=[{},{}]; save(); renderPlayers(); render();
});

/* ===== Início ===== */
(async()=>{
  let raw=await Store.get();
  for(const k of OLD){ if(raw) break; raw=await Store.get(k); }
  if(raw) load(raw);
  renderPlayers(); render();
})();
</script>
</body>
</html>
