<style>
:root{
  --bg:#151A1B; --panel:#1F2628; --panel2:#263030; --line:#394543;

  --display:'Oswald','Trebuchet MS',sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;padding:0}
input,select,textarea{font-family:var(--body);font-size:14px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:9px 10px;width:100%;outline:none}
textarea{resize:vertical}
:focus-visible{box-shadow:0 0 0 2px var(--gold)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}

header .s{font-size:11px;color:var(--muted)}
header .mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--gold)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-family:var(--display);font-size:26px;font-weight:600;margin:0}
h2{font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 8px}
p{line-height:1.6;font-size:13px}
.muted{color:var(--muted)}
.small{font-size:11px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.row{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:8px}
.btn{font-family:var(--display);font-size:14px;letter-spacing:.3px;border:1px solid var(--line);border-radius:6px;padding:9px 14px;color:var(--ink);display:inline-block}
.btn.gold{background:var(--gold);color:#1B1608;border-color:var(--gold)}
.btn.red{background:var(--red);color:#F6E9E4;border-color:var(--red)}
.btn.solid{background:var(--panel2)}
.btn.sm{font-size:12px;padding:5px 10px}
.btn.full{display:block;width:100%;text-align:center}
.btn[disabled]{opacity:.35}
.back{font-family:var(--display);font-size:13px;color:var(--muted);margin-bottom:12px;display:block}
.tag{font-family:var(--display);font-size:11px;border-radius:5px;padding:3px 7px;border:1px solid currentColor;display:inline-block}
.box{width:15px;height:15px;border-radius:3px;border:1px solid var(--line);flex:none}
.bar{display:flex;gap:2px;margin-top:8px}
.bar i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.lvl{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.lvl.cur{border-color:var(--gold);background:var(--panel2)}
.lvl .n{font-family:var(--display);font-size:20px;color:var(--muted);width:32px;flex:none}
.lvl .nm{font-family:var(--display);font-size:15px}
.track{display:flex;gap:3px}
.track i{flex:1;height:26px;border-radius:3px;background:var(--panel);border:1px solid var(--line);opacity:.5}
.track i.rw{opacity:.95}
.check{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;padding:9px 8px;border-radius:6px}
.check .box{margin-top:2px}
.check.on span{color:var(--muted);text-decoration:line-through}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px}
.opt.on{border-color:var(--gold);background:var(--panel2)}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:22px;color:var(--gold);font-weight:500}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:14px 0;font-family:var(--display);font-size:13px;color:var(--muted);border-top:2px solid transparent}
nav button.on{color:var(--gold);border-top-color:var(--gold)}
#toast{position:fixed;left:0;right:0;bottom:80px;display:flex;justify-content:center;pointer-events:none;z-index:9}
#toast div{background:var(--gold);color:#1B1608;font-family:var(--display);font-size:13px;padding:8px 14px;border-radius:6px}
.sec{margin-top:22px}
.acc{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;padding:13px;font-family:var(--display);font-size:16px}
.bul{display:flex;gap:9px;margin-bottom:8px}
.bul i{width:4px;height:4px;border-radius:2px;background:var(--gold);margin-top:8px;flex:none}
.bul span{font-size:13px;line-height:1.55}
</style>

/* =========================================================
   Storage (localStorage → window.storage → memory)
   ========================================================= */
const K_CAMP="ros:campaign:v1", K_GAMES="ros:games:v1";
const mem={};
let mode="memory";
try{ localStorage.setItem("ros:test","1"); localStorage.removeItem("ros:test"); mode="local"; }
catch(e){ if(window.storage) mode="host"; }

async function load(k,fb){
  try{
    if(mode==="local"){ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }
    if(mode==="host"){ const r=await window.storage.get(k); return r&&r.value?JSON.parse(r.value):fb; }
  }catch(e){}
  return mem[k]!==undefined?mem[k]:fb;
}
async function save(k,v){
  mem[k]=v;
  try{
    if(mode==="local"){ localStorage.setItem(k,JSON.stringify(v)); return; }
    if(mode==="host"){ await window.storage.set(k,JSON.stringify(v)); }
  }catch(e){}
}

const lv = n => S.campaign.levels[n] || {goal:false,challenge:false};
const actDone = (a,f) => LEVELS.filter(l=>l.act===a).every(l=>lv(l.n)[f]);
function earned(){
  let p=0;
  LEVELS.filter(l=>l.act<=2).forEach(l=>{const s=lv(l.n); if(s.goal)p++; if(s.challenge)p++;});
  [1,2].forEach(a=>{ if(actDone(a,"goal"))p++; if(actDone(a,"challenge"))p++; });
  return p;
}
const spent = () => S.campaign.camp.command+S.campaign.camp.logistics+S.campaign.camp.renown;
const free = () => earned()-spent();
function current(){ const l=LEVELS.find(l=>!lv(l.n).goal); return l?l.n:null; }
function reward(id,f){ let b=null; TRACKS[id].rewards.forEach(r=>{ if(f>=r.at) b=r; }); return b; }
const L = n => LEVELS.find(l=>l.n===n);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const roman = a => a===1?"I":a===2?"II":"III";
const plural = (n,w) => n+" "+w+(n===1?"":"s");

let toastTimer;
function toast(msg){
  const t=document.getElementById("toast");
  t.innerHTML="<div>"+esc(msg)+"</div>";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.innerHTML="";},2200);
}

function viewCampaign(){
  const cur=current(), done=LEVELS.filter(l=>lv(l.n).goal).length, p=free();
  let h="";
  h+='<div class="muted small">'+done+' of 19 Levels won · '+plural(p,"Upgrade Point")+' available</div>';
  h+='<div class="bar">'+LEVELS.map(l=>{
    const s=lv(l.n);
    const c=s.goal?(s.challenge?"var(--gold)":"var(--green)"):(l.n===cur?"var(--red)":"var(--line)");
    return '<i style="background:'+c+'"></i>';
  }).join("")+'</div>';

  if(cur){
    const c=L(cur);
    h+='<div class="panel" style="border-color:var(--gold);padding:16px;margin-top:16px">'
      +'<div style="font-family:var(--display);font-size:12px;color:var(--gold)">Current Level</div>'
      +'<div style="font-family:var(--display);font-size:26px;line-height:1.1">'+pad(c.n)+' · '+esc(c.name)+'</div>'
      +'<div class="muted" style="font-size:13px;margin-top:4px">Act '+roman(c.act)+(c.hero?' · Hero: '+esc(c.hero):'')+'</div>'
      +'<div class="row" style="margin-top:14px">'
      +'<button class="btn gold" data-go="level" data-n="'+c.n+'">Set up game</button>'
      +'<button class="btn" data-go="form" data-n="'+c.n+'">Log result</button></div></div>';
  }else{
    h+='<div class="panel" style="border-color:var(--gold);padding:16px;margin-top:16px">'
      +'<div style="font-family:var(--display);font-size:22px;color:var(--gold)">Campaign complete</div>'
      +'<p class="muted" style="margin:4px 0 0">All 19 Levels are won. Check the list below for Challenges still open if you want to fill the Home Camp.</p></div>';
  }

  [1,2,3].forEach(a=>{
    h+='<div class="sec"><h2>'+ACT_INFO[a].title+'</h2>'
      +'<p class="muted" style="margin:0 0 10px;font-size:12px">'+ACT_INFO[a].text+'</p><div class="grid">';
    LEVELS.filter(l=>l.act===a).forEach(l=>{
      const s=lv(l.n);
      h+='<button class="lvl'+(l.n===cur?' cur':'')+'" data-go="level" data-n="'+l.n+'">'
        +'<span class="n" style="'+(s.goal?'color:var(--gold)':'')+'">'+pad(l.n)+'</span>'
        +'<span style="flex:1"><span class="nm" style="display:block">'+esc(l.name)+'</span>'
        +'<span class="muted small">'+(l.hero?'Hero: '+esc(l.hero):(l.goal?"Goal":"No extra Goal"))+'</span></span>'
        +'<span class="box" style="'+(s.goal?'background:var(--green);border-color:var(--green)':'')+'"></span>'
        +(l.act<=2?'<span class="box" style="'+(s.challenge?'background:var(--gold);border-color:var(--gold)':'')+'"></span>':'')
        +'</button>';
    });
    h+='</div>';
    if(a<=2){
      h+='<div class="row" style="justify-content:space-between;border:1px dashed var(--line);border-radius:8px;padding:12px;margin-top:8px">'
        +'<span class="muted small">Act summary: all Goals · all Challenges</span><span class="row" style="gap:4px">'
        +'<span class="box" style="'+(actDone(a,"goal")?'background:var(--green);border-color:var(--green)':'')+'"></span>'
        +'<span class="box" style="'+(actDone(a,"challenge")?'background:var(--gold);border-color:var(--gold)':'')+'"></span>'
        +'</span></div>';
    }
    h+='</div>';
  });
  return h;
}

function setupSteps(l){
  const c=S.campaign.camp, st=[];
  st.push("Set up the Main Board as normal: Quests, Plunder and Workers.");
  if(l.act===1) st.push("Use "+l.hero+" as your Hero Card. Draw "+(c.command>=6?"3":"2")+" cards from the Crew draw pile and choose 1 as your starting Crew Member.");
  else st.push("Reveal 2 sets of one Hero and one starting Crew Member and choose 1 set"+(c.command>=6?" (the Command upgrade gives you 1 extra Crew Member to choose from)":"")+".");
  st.push("Select the AI Crew Card for difficulty and give the AI the Provisions pictured on that card.");
  st.push("Shuffle the AI Scheme Cards. AI Score Marker on 0 VP.");
  const rl=reward("logistics",c.logistics);
  st.push("Take 3 Silver and 1 Provision"+(rl?", plus the Logistics reward: "+rl.text.replace(" during Setup",""):"")+".");
  const rc=reward("command",c.command);
  st.push("Deal yourself 5 Crew Cards"+(rc?" plus the Command reward: "+rc.text:"")+", keep 3 and discard the rest.");
  const rr=reward("renown",c.renown);
  if(rr) st.push("Renown: "+rr.text+".");
  l.setup.forEach(x=>st.push("Level rule — "+x));
  return st;
}

function viewCamp(){
  const e=earned(), s=spent(), f=e-s;
  let h='<h1>Home Camp</h1>';
  h+='<p class="muted">Every Goal and every Challenge completed in Acts I and II fills 1 box, plus 1 for each Act summary — all Goals and all Challenges. Spend those boxes across the three tracks. Only the highest reward on each track counts.</p>';
  h+='<div class="row" style="justify-content:space-between;border:1px solid var(--gold);border-radius:8px;padding:12px;background:var(--panel)">'
    +'<span class="muted small">Earned '+e+' · spent '+s+'</span>'
    +'<span style="font-family:var(--display);font-size:22px;color:'+(f>0?"var(--gold)":"var(--muted)")+'">'+f+' available</span></div>';

  Object.keys(TRACKS).forEach(id=>{
    const t=TRACKS[id], fl=S.campaign.camp[id], act=reward(id,fl);
    h+='<div class="sec"><div class="row" style="justify-content:space-between;margin-bottom:6px">'
      +'<span><span style="font-family:var(--display);font-size:18px;color:'+t.color+'">'+t.label+'</span> <span class="muted small">'+t.note+'</span></span>'
      +'<span class="row" style="gap:6px">'
      +'<button class="btn sm" data-act="camp" data-id="'+id+'" data-d="-1"'+(fl===0?" disabled":"")+'>−</button>'
      +'<button class="btn sm solid" data-act="camp" data-id="'+id+'" data-d="1"'+((f<=0||fl===t.size)?" disabled":"")+'>+</button>'
      +'</span></div><div class="track">';
    for(let i=0;i<t.size;i++){
      const filled=i<fl, isR=t.rewards.some(r=>r.at===i+1);
      h+='<i class="'+(isR?"rw":"")+'" style="'+(filled?"background:"+t.color+";opacity:1;border-color:"+t.color:(isR?"border-color:"+t.color:""))+'"></i>';
    }
    h+='</div><div style="font-size:12px;margin-top:8px">'+(act?"Active: "+act.text:"No reward reached yet.")+'</div>';
    t.rewards.forEach(r=>{
      h+='<div class="small" style="line-height:1.5;color:'+(fl>=r.at?t.color:"var(--muted)")+'">'+r.at+' · '+r.text+'</div>';
    });
    h+='</div>';
  });
  h+='<p class="muted small" style="margin-top:22px">Note: the campaign PDF shows the Renown rewards only as numbered Eagle icons (1, 2, 3, 4, 5, 7). They are read here as starting VP.</p>';
  return h;
}

/* =========================================================
   Render and events
   ========================================================= */
const TABS=[["campaign","Campaign"],["camp","Home Camp"],["games","Game Log"],["rules","Reference"]];
let jumpTop=false;

function render(){
  const app=document.getElementById("app");
  const y=window.scrollY;
  let h;
  if(S.form) h=viewForm();
  else if(S.level!==null) h=viewLevel();
  else if(S.tab==="campaign") h=viewCampaign();
  else if(S.tab==="camp") h=viewCamp();
  else if(S.tab==="games") h=viewGames();
  else h=viewRules();
  app.innerHTML=h;
  document.getElementById("nav").innerHTML=TABS.map(([id,label])=>{
    const on=S.tab===id&&!S.form&&S.level===null;
    return '<button class="'+(on?"on":"")+'" data-go="'+id+'">'+label+'</button>';
  }).join("");
  window.scrollTo(0, jumpTop?0:y);
  jumpTop=false;
}

function syncForm(){
  if(!S.form) return;
  const g=id=>document.getElementById(id);
  if(g("f-my")) S.form.myVP=g("f-my").value;
  if(g("f-ai")) S.form.aiVP=g("f-ai").value;
  if(g("f-date")) S.form.date=g("f-date").value;
  if(g("f-notes")) S.form.notes=g("f-notes").value;
}

function openForm(n){
  const level=n||current()||1, l=L(level);
  S.form={level:level,date:new Date().toISOString().slice(0,10),ai:"lookout",
    myVP:"",aiVP:"",goal:!l.goal,challenge:false,notes:"",override:null};
  S.level=null; jumpTop=true; render();
}

function saveGame(){
  syncForm();
  const f=S.form, l=L(f.level);
  const my=parseInt(f.myVP,10), op=parseInt(f.aiVP,10);
  const computed=!isNaN(my)&&!isNaN(op)&&my>op&&f.goal;
  const win=f.override===null?computed:f.override;
  S.games.push({id:Date.now(),date:f.date,level:f.level,ai:f.ai,
    myVP:isNaN(my)?0:my,aiVP:isNaN(op)?0:op,goal:f.goal,challenge:f.challenge,win:win,notes:f.notes});
  const prev=lv(f.level);
  S.campaign.levels[f.level]={
    goal: prev.goal||win,
    challenge: prev.challenge||(win&&f.challenge&&l.act<=2)
  };
  S.form=null; S.tab="campaign";
  persist(); jumpTop=true; render();
  toast(win?"Level won. Game saved.":"Game saved.");
}

function persist(){ save(K_CAMP,S.campaign); save(K_GAMES,S.games); }

document.addEventListener("click",function(ev){
  const el=ev.target.closest("[data-go],[data-act]");
  if(!el) return;
  const go=el.getAttribute("data-go"), act=el.getAttribute("data-act");

  if(go){
    if(go==="level"){ S.level=parseInt(el.dataset.n,10); S.form=null; }
    else if(go==="form"){ openForm(el.dataset.n?parseInt(el.dataset.n,10):null); return; }
    else if(go==="back"){ S.form=null; }
    else { S.tab=go; S.level=null; S.form=null; }
    jumpTop=true; render(); return;
  }

  if(act==="check"){
    const n=S.level, i=el.dataset.i;
    S.checks[n]=S.checks[n]||{};
    S.checks[n][i]=!S.checks[n][i]; render(); return;
  }
  if(act==="clearchecks"){ S.checks[S.level]={}; render(); return; }

  if(act==="camp"){
    const id=el.dataset.id, d=parseInt(el.dataset.d,10), cur=S.campaign.camp[id];
    const next=cur+d;
    if(next<0||next>TRACKS[id].size) return;
    if(d>0&&free()<=0) return;
    S.campaign.camp[id]=next; persist(); render(); return;
  }

  if(act==="ai"){ syncForm(); S.form.ai=el.dataset.id; render(); return; }
  if(act==="goal"){ syncForm(); S.form.goal=!S.form.goal; S.form.override=null; render(); return; }
  if(act==="ch"){ syncForm(); S.form.challenge=!S.form.challenge; render(); return; }
  if(act==="flip"){
    syncForm();
    const f=S.form, my=parseInt(f.myVP,10), op=parseInt(f.aiVP,10);
    const computed=!isNaN(my)&&!isNaN(op)&&my>op&&f.goal;
    const win=f.override===null?computed:f.override;
    f.override=!win; render(); return;
  }
  if(act==="save"){ saveGame(); return; }

  if(act==="del"){
    const id=parseInt(el.dataset.id,10);
    S.games=S.games.filter(g=>g.id!==id); persist(); render(); return;
  }
  if(act==="acc"){ const i=parseInt(el.dataset.i,10); S.acc=S.acc===i?-1:i; render(); return; }

  if(act==="reset"){
    if(confirm("Erase all campaign progress and the game log?")){
      S.campaign={levels:{},camp:{command:0,logistics:0,renown:0}};
      S.games=[]; persist(); render(); toast("Campaign reset.");
    }
    return;
  }
  if(act==="export"){
    const data=JSON.stringify({campaign:S.campaign,games:S.games},null,1);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    a.download="raiders-of-scythia-backup-"+new Date().toISOString().slice(0,10)+".json";
    a.click(); URL.revokeObjectURL(a.href); toast("Backup downloaded."); return;
  }
  if(act==="importopen"){
    const b=document.getElementById("importbox");
    b.style.display=b.style.display==="none"?"block":"none"; return;
  }
  if(act==="import"){
    try{
      const d=JSON.parse(document.getElementById("f-import").value);
      if(d.campaign) S.campaign={levels:d.campaign.levels||{},camp:Object.assign({command:0,logistics:0,renown:0},d.campaign.camp||{})};
      if(Array.isArray(d.games)) S.games=d.games;
      persist(); render(); toast("Backup restored.");
    }catch(e){ toast("That file could not be read."); }
    return;
  }
});

document.addEventListener("change",function(ev){
  if(ev.target.id==="f-level"&&S.form){
    syncForm();
    S.form.level=parseInt(ev.target.value,10);
    const l=L(S.form.level);
    S.form.goal=!l.goal; S.form.challenge=false; S.form.override=null;
    render();
  }
});

/* =========================================================
   PWA manifest, generated in memory
   ========================================================= */
(function(){
  const icon="data:image/svg+xml,"+encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='#151A1B'/><circle cx='256' cy='256' r='120' fill='none' stroke='#D4A32C' stroke-width='36'/><rect x='236' y='60' width='40' height='90' fill='#B04A34'/></svg>");
  const manifest={name:"Raiders of Scythia — Solo Campaign",short_name:"RoS Campaign",
    start_url:".",display:"standalone",background_color:"#151A1B",theme_color:"#151A1B",
    icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any"}]};
  try{
    const link=document.createElement("link");
    link.rel="manifest";
    link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
    document.head.appendChild(link);
  }catch(e){}
})();

/* Boot */
(async function(){
  const c=await load(K_CAMP,null), g=await load(K_GAMES,null);
  if(c) S.campaign={levels:c.levels||{},camp:Object.assign({command:0,logistics:0,renown:0},c.camp||{})};
  if(Array.isArray(g)) S.games=g;
  render();
})();
</script>
